<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="color-scheme" content="light dark">
<title>Cuenta bancaria</title>
<style>
  :root {
    --bg: #f6f4f0; --card: #ffffff; --ink: #161514; --muted: #6f6b66;
    --line: #e7e3dc; --btn: #161514; --btn-ink: #ffffff; --ok: #1f7a4d;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121110; --card: #1c1b19; --ink: #f2efe9; --muted: #a39e96;
            --line: #2e2c29; --btn: #f2efe9; --btn-ink: #121110; --ok: #5fd39a; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh; background: var(--bg); color: var(--ink);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    display: flex; align-items: center; justify-content: center;
    padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
  }
  main { width: 100%; max-width: 420px; }
  h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; margin: 0 0 6px; text-align: center; }
  .sub { color: var(--muted); text-align: center; margin: 0 0 24px; font-size: 15px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
  .row { display: flex; align-items: center; gap: 12px; padding: 16px 18px; border-top: 1px solid var(--line); }
  .row:first-child { border-top: 0; }
  .txt { flex: 1; min-width: 0; }
  .label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 3px; }
  .value { font-size: 18px; font-weight: 600; word-break: break-word; }
  .mono { font-variant-numeric: tabular-nums; letter-spacing: 0.01em; white-space: nowrap; font-size: 16.5px; }
  @media (max-width: 350px) { .mono { font-size: 15px; } }
  button {
    flex: none; appearance: none; border: 0; cursor: pointer; font: inherit; font-size: 14px; font-weight: 600;
    background: var(--btn); color: var(--btn-ink); padding: 10px 12px; border-radius: 10px; min-width: 78px;
    transition: transform .08s ease, opacity .2s ease;
  }
  button:active { transform: scale(0.97); }
  button.done { background: var(--ok); color: #fff; }
  .all { display: block; width: 100%; margin-top: 16px; padding: 14px; font-size: 15px; border-radius: 12px; }
  .hint { color: var(--muted); font-size: 13px; text-align: center; margin: 14px 0 0; }
</style>
</head>
<body>
<main>
  <h1>Cuenta bancaria</h1>
  <p class="sub">Datos para transferencia</p>

  <section class="card">
    <div class="row">
      <div class="txt"><div class="label">Titular</div><div class="value">Andrés Elizondo</div></div>
      <button type="button" data-copy="Andrés Elizondo">Copiar</button>
    </div>
    <div class="row">
      <div class="txt"><div class="label">Banco</div><div class="value">BBVA</div></div>
      <button type="button" data-copy="BBVA">Copiar</button>
    </div>
    <div class="row">
      <div class="txt"><div class="label">CLABE</div><div class="value mono">0123 2002 9864 0621 11</div></div>
      <button type="button" data-copy="012320029864062111">Copiar</button>
    </div>
    <div class="row">
      <div class="txt"><div class="label">Número de cuenta</div><div class="value mono">2986 4062 11</div></div>
      <button type="button" data-copy="2986406211">Copiar</button>
    </div>
  </section>

  <button type="button" class="all" data-copy="Titular: Andrés Elizondo&#10;Banco: BBVA&#10;CLABE: 012320029864062111&#10;Cuenta: 2986406211">Copiar todos los datos</button>
  <p class="hint">Toca “Copiar” y pégalo en la app de tu banco.</p>
</main>
<script>
  function fallbackCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
    var ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta); return ok;
  }
  document.querySelectorAll('[data-copy]').forEach(function (btn) {
    var original = btn.textContent;
    btn.addEventListener('click', function () {
      var text = btn.getAttribute('data-copy');
      var done = function () {
        btn.textContent = 'Copiado ✓'; btn.classList.add('done');
        setTimeout(function () { btn.textContent = original; btn.classList.remove('done'); }, 1800);
      };
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(done, function () { if (fallbackCopy(text)) done(); });
      } else if (fallbackCopy(text)) { done(); }
    });
  });
</script>
</body>
</html>
